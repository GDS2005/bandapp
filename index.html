<style>
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#EAF0F2; --ink:#2E3A52; --muted:#66728A; --line:#DAE2E6;
  --brand:#4FC3C8; --brand-ink:#08363A; --chord:#0E7B83; --soft:#DDF3F4; --shadow:0 1px 2px rgba(30,50,70,.06),0 4px 16px rgba(30,50,70,.06);
  --ok:#2A8F63; --warn:#B67A0E; --hard:#BB4A46;
  --display:"Josefin Sans","Avenir Next","Century Gothic",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --lyric:19px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#111920; --surface:#18232D; --surface-2:#1F2D39; --ink:#E4EBF0; --muted:#93A1B2; --line:#2A3A48;
    --brand:#4FC3C8; --brand-ink:#062C2F; --chord:#6ED6DB; --soft:#153539; --shadow:0 1px 2px rgba(0,0,0,.3);
    --ok:#4CC08A; --warn:#E0A63B; --hard:#E77570;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111920; --surface:#18232D; --surface-2:#1F2D39; --ink:#E4EBF0; --muted:#93A1B2; --line:#2A3A48;
  --brand:#4FC3C8; --brand-ink:#062C2F; --chord:#6ED6DB; --soft:#153539; --shadow:0 1px 2px rgba(0,0,0,.3);
  --ok:#4CC08A; --warn:#E0A63B; --hard:#E77570;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}

.word{font-family:var(--display);font-weight:600;letter-spacing:.2em;font-size:19px;padding-top:4px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:700;font-size:15px}
.tab[aria-current="page"]{background:var(--soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px;line-height:1.2}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--hard)}
.btn.danger.armed{background:var(--hard);border-color:var(--hard);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
@media (max-width:520px){.top .wrap{gap:6px}.word{font-size:15px;letter-spacing:.12em}.tabs{gap:0}.tab{padding:7px 8px;font-size:14px}.newlbl{display:none}#new-song{padding:8px 12px}}

main{padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px;font-weight:700;letter-spacing:.01em}
h2{font-size:20px;font-weight:700}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}

/* Library */
.libhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;padding:11px 0;width:100%;outline:none}
.search:focus-within{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:700;font-size:17px}
.row .a{color:var(--muted);font-size:14px}
.row .meta{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:end;gap:6px}
.row .pills{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.key{font-family:var(--mono);font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--chord);white-space:nowrap}
.pill{font-family:var(--mono);font-weight:600;font-size:12px;background:var(--soft);color:var(--chord);border-radius:6px;padding:1px 7px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.lvl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.lvl.principiante{--c:var(--ok)} .lvl.intermedio{--c:var(--warn)} .lvl.avanzado{--c:var(--hard)}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 7px}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.verfoot{padding-block:24px 32px;text-align:center;font-size:12px;color:var(--muted);opacity:.8}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}

/* Song */
.songhead{display:flex;flex-wrap:wrap;gap:12px;align-items:start;justify-content:space-between}
.songsub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:4px}
.songartist{color:var(--muted);font-size:15px}
.tagsugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.tagsugg:empty{display:none}
.tag.sug{cursor:pointer;font:inherit;font-size:12px}
.tag.sug:hover{border-color:var(--brand);color:var(--chord)}
.tlist .trow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.tlist .trow:first-child{border-top:0}
.tlist .tname{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.tlist .tname .tag{font-size:14px}
.tlist .actions .btn{padding:6px 12px;font-size:14px}
.tedit{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tedit input{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.duprow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.capochip{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:7px;padding:1px 9px;line-height:1.5}
.songdetails{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dgrid{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0}
.dgrid dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dgrid dd{margin:2px 0 0;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#details .chev{font-size:11px;margin-left:2px}
.songmeta .key.capo{color:var(--warn);border-color:currentColor}
.songmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.dcard{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px;min-width:78px}
.dcard:hover{border-color:var(--brand)}
.dcard .n{font-family:var(--mono);font-weight:700;color:var(--chord);font-size:14px}
.capnote{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px}
.sheet-lyrics{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 28px;box-shadow:var(--shadow);font-size:var(--lyric)}
.sec{font-family:var(--display);font-weight:700;font-size:.72em;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:1.3em 0 .2em}
.sec:first-child{margin-top:0}
.chorus{border-left:3px solid var(--brand);padding-left:14px;margin-block:.3em}
.ln{line-height:1.45;min-height:1em}
.ln.hc{line-height:2.55}
.gap{height:.8em}
.cw{display:inline-block;position:relative;line-height:1.25;min-width:calc(var(--n,0)*.52em + .45em);text-indent:0}
.ch{position:absolute;left:0;bottom:1.55em;font-family:var(--mono);font-weight:700;font-size:.8em;color:var(--chord);background:none;border:0;padding:0 .1em;border-radius:4px;line-height:1.2;white-space:nowrap}
.ch:hover{background:var(--soft)}
.practice .ch{display:none}.practice .ln.hc{line-height:1.45}.practice .cw{min-width:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.bar .in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.ctl{display:flex;align-items:center;gap:4px}
.ctl .lb{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-right:2px}
.ctl .v{font-family:var(--mono);font-weight:700;min-width:2.6em;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;display:inline-grid;place-items:center;padding:0}
.ib:hover{border-color:var(--brand)}
.play{height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.play[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px}
.toggle[aria-pressed="true"]{background:var(--soft);border-color:var(--brand);color:var(--ink)}
.songpad{padding-bottom:110px}

/* Chord sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:40;display:grid;place-items:end center}
.panel{background:var(--surface);width:min(420px,100%);border-radius:18px 18px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
@media (min-width:640px){.scrim{place-items:center}.panel{border-radius:18px}}
.panel .big{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--chord)}

/* Editor */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand)}
.f textarea{font-family:var(--mono);font-size:14px;line-height:1.6;min-height:320px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.hint code{font-family:var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.err{color:var(--hard);font-size:14px;font-weight:700}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.preview{font-size:17px;padding:16px;max-height:520px;overflow:auto}

/* ---------- Music theory ---------- */
const NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const IDX = {C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};

function parseChord(c){ const m = CHORD_RE.exec(c.trim()); if(!m) return null; return {root:m[1], q:m[2]||'', bass:m[3]||null}; }
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], FLAT = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
// Spelling rule: a chord is shown exactly as written until it is transposed. When transposed, it follows the
// target key's convention (flat keys → bemoles, the rest → sostenidos). Comparisons use a canonical sharp spelling.
function shift(note,n,flat){ const i=((IDX[note]+n)%12+12)%12; return (flat?FLAT:SHARP)[i]; }
function transpose(c,n,flat){ const p=parseChord(c); if(!p) return c; if(!n) return c.trim(); if(flat===undefined) flat=/b/.test(p.root); return shift(p.root,n,flat)+p.q+(p.bass?'/'+shift(p.bass,n,flat):''); }

function base(c){ const p=parseChord(c); return p? shift(p.root,0,false)+p.q : c; }
const FLAT_KEYS = new Set(['F','A#','D#','G#','C#','Dm','Gm','Cm','Fm','A#m','D#m']);
function flatFor(key, chords, n){
  if(key){ return FLAT_KEYS.has(base(transpose(key,n,false))); }
  const acc = chords.map(c=>(parseChord(c)||{}).root||''); return acc.filter(r=>/b/.test(r)).length > acc.filter(r=>/#/.test(r)).length;

  for(let i=0;i<=4;i++) g += `<line x1="${x0}" x2="${x0+sw*5}" y1="${y0+i*fh}" y2="${y0+i*fh}" stroke="var(--muted)" stroke-width="${.8*scale}"/>`;
  for(let s=0;s<6;s++) g += `<line x1="${x0+s*sw}" x2="${x0+s*sw}" y1="${y0}" y2="${y0+gridH}" stroke="var(--muted)" stroke-width="${.9*scale}"/>`;

    const yy = y0+(sh.b-start+.5)*fh; g += `<rect x="${x0+a*sw-4*scale}" y="${yy-3.6*scale}" width="${(z-a)*sw+8*scale}" height="${7.2*scale}" rx="${3.6*scale}" fill="var(--chord)"/>`; }

/* ---------- Letras con acordes ----------
   Se aceptan dos formatos, incluso mezclados en la misma canción:
   1) Acordes ARRIBA de la letra (como en Ultimate Guitar o Cifra Club): se muestran tal cual,
      en letra de ancho fijo para que cada acorde quede sobre su sílaba.
   2) ChordPro: A[G]mazing [C]grace, con {c: Estribillo} para secciones.
   En ambos los acordes se pueden tocar, transponer y ocultar. */
// Rótulos de sección: cualquier "[Algo]" que no sea un acorde, o palabras típicas con dos puntos ("Coro:", "Verse 2:").
const SECTION_RE = /^(?:\[([^\]]+)\]|((?:intro|verso|estrofa|coro|estribillo|puente|solo|outro|final|pre-?coro|interludio|instrumental|riff|chorus|verse|bridge|pre-?chorus|hook|interlude)(?:\s*\d+)?)\s*:)$/i;
const DECOR_RE = /^(?:[()|\-\/.:*~]+|\(?x\d+\)?|\d+x)$/i; // ( ) | - x2 …
const expandTabs = l => l.replace(/\t/g,'    ');
/** Quita caracteres invisibles (espacio de ancho cero, BOM, guion suave) y pasa espacios raros
 *  (no separable, finos) a espacios comunes. Las webs los agregan al copiar desde la compu. */
function cleanText(t){ return String(t||'').replace(/\r\n?/g,'\n').replace(/[\u200B-\u200D\u2060\uFEFF\u00AD]/g,'').replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g,' '); }
function sectionLabel(word){ const m=SECTION_RE.exec(word); if(!m) return null; const lab=(m[1]||m[2]||'').trim(); return lab && !parseChord(lab) ? lab : null; }
function hasInlineChord(line){ let ok=false; line.replace(/\[([^\]]+)\]/g,(m,c)=>{ if(parseChord(c)) ok=true; return m; }); return ok; }
/**
 * Si la línea es solo de acordes (con un rótulo opcional al principio, como "[Intro]", y adornos
 * como paréntesis, barras o "x2"), devuelve sus partes con la columna de cada una. Si no, null.
 */
function chordLineInfo(raw){
  const l=expandTabs(cleanText(raw));
  if(!l.trim() || hasInlineChord(l)) return null;
  const toks=[]; const re=/\S+/g; let m, w=0, chords=0;
  // Rótulo opcional al principio: "[Intro] C G Am F" o "Coro: C G"
  const lm=/^(\s*)(\[[^\]]+\]|[A-Za-z-]+(?:\s*\d+)?\s*:)/.exec(l);
  if(lm && sectionLabel(lm[2])){ toks.push({kind:'label',text:lm[2],pos:lm[1].length,w:0}); re.lastIndex=lm[0].length; }
  while((m=re.exec(l))){
    const word=m[0], pos=m.index; w++;
    const mm=/^([(|\[]*)(.*?)([)|\],]*)$/.exec(word); const pre=mm[1], core=mm[2], post=mm[3];
    if(core && parseChord(core)){
      if(pre) toks.push({kind:'dec',text:pre,pos,w});
      toks.push({kind:'chord',text:core,pos:pos+pre.length,w}); chords++;
      if(post) toks.push({kind:'dec',text:post,pos:pos+pre.length+core.length,w});
      continue;
    }
    if(DECOR_RE.test(word)){ toks.push({kind:'dec',text:word,pos,w}); continue; }
    return null; // hay una palabra que no es acorde: es letra
  }
  return chords ? {tokens:toks} : null;
}
function chordsIn(body){
  const out=[], seen=new Set();
  const add=c=>{ if(parseChord(c)){ const b=norm(c); if(!seen.has(b)){ seen.add(b); out.push(c.trim()); } } };
  for(const line of cleanText(body).split('\n')){
    const info=chordLineInfo(line);
    if(info) info.tokens.forEach(t=>{ if(t.kind==='chord') add(t.text); });
    else line.replace(/\[([^\]]+)\]/g,(m,c)=>{ add(c); return m; });
  }
  return out;
}
/* Ubica cada parte de una línea de acordes en su columna. Si un acorde transpuesto es más largo
   (C → C#), corre lo que sigue para que nunca se peguen. */
function layoutChordLine(info, map){
  let col=0, prevW=0; const out=[];
  for(const t of info.tokens){
    const shown = t.kind==='chord' ? map(t.text) : t.text;
    const pad = Math.max(t.pos-col, (prevW && prevW!==t.w) ? 1 : 0);
    out.push({kind:t.kind, text:t.text, shown, col:col+pad});
    col += pad + shown.length; prevW=t.w;
  }
  return out;
}
/* Arma el HTML de las partes que caen entre las columnas a y b (b excluida). */
function chordSegHtml(toks, a, b){
  let col=a, h='';
  for(const t of toks){
    if(t.col<a || t.col>=b) continue;
    h += ' '.repeat(Math.max(0,t.col-col));
    if(t.kind==='chord') h += `<button class="chi" data-c="${esc(t.shown)}" data-orig="${esc(t.text)}">${esc(t.shown)}</button>`;
    else if(t.kind==='label') h += `<span class="clab">${esc(t.text)}</span>`;
    else h += `<span class="cdec">${esc(t.text)}</span>`;
    col = t.col + t.shown.length;
  }
  return h;
}
function chordLineHtml(info, map){ return chordSegHtml(layoutChordLine(info,map), 0, Infinity); }
/**
 * v0.5 · Corta un renglón de acordes (y su letra, si la tiene debajo) en tramos de hasta `cols`
 * columnas, para que entre en la pantalla sin scroll lateral. Corta en un espacio de la letra y
 * nunca en medio de un acorde, así cada acorde sigue arriba de su sílaba.
 */
function splitColumns(toks, lyric, cols){
  const ly = lyric||'';
  const end = Math.max(ly.length, ...toks.map(t=>t.col+t.shown.length), 0);
  const covered = c => toks.some(t=>t.col<c && c<t.col+t.shown.length);
  const blank = c => c>=ly.length || ly[c]===' ';
  const segs=[]; let a=0;
  while(cols>0 && end-a>cols){
    let b=-1;
    for(let c=a+cols; c>a+Math.floor(cols*0.35); c--){ if(!covered(c) && (blank(c) || blank(c-1))){ b=c; break; } }
    if(b<0) for(let c=a+cols; c>a; c--){ if(!covered(c)){ b=c; break; } }
    if(b<0) b=a+cols;
    segs.push([a,b]);
    a=b; while(a<end && blank(a) && !toks.some(t=>t.col===a)) a++;
  }
  if(a<end || !segs.length) segs.push([a,end]);

}
function renderBody(body, map, cols){
  const lines=cleanText(body).split('\n');
  const sheet = lines.some(l=>chordLineInfo(l)); // ¿formato acordes arriba?
  let html='', open=false;
  const isLyric = l => l!==undefined && l.trim() && !chordLineInfo(l) && !sectionLabel(l.trim()) && !/^\s*\{/.test(l) && !hasInlineChord(l);
  for(let i=0;i<lines.length;i++){
    const line = expandTabs(lines[i]).replace(/\s+$/,'');
    const d = /^\{\s*([\w_]+)\s*(?::\s*(.*))?\}$/.exec(line.trim());
    if(d){ const k=d[1].toLowerCase(), v=d[2]||'';
      if(k==='c'||k==='comment'||k==='ci') html+=`<div class="sec">${esc(v)}</div>`;
      else if(k==='soc'||k==='start_of_chorus'){ if(!open){html+=`<div class="chorus">${v?`<div class="sec">${esc(v)}</div>`:''}`; open=true;} }
      else if((k==='eoc'||k==='end_of_chorus')&&open){ html+='</div>'; open=false; }
      continue; }
    if(!line.trim()){ html+='<div class="gap"></div>'; continue; }
    const lab = sectionLabel(line.trim());
    if(lab){ html+=`<div class="sec">${esc(lab)}</div>`; continue; }
    const info = chordLineInfo(line);
    if(info){
      const toks = layoutChordLine(info,map);
      if(!cols){ html+=`<div class="ln cl">${chordSegHtml(toks,0,Infinity)}</div>`; continue; }
      const nx = lines[i+1]!==undefined ? expandTabs(lines[i+1]).replace(/\s+$/,'') : undefined;
      const lyric = isLyric(nx) ? nx : null; if(lyric!==null) i++;
      splitColumns(toks, lyric, cols).forEach(([a,b],k)=>{
        const cont = k ? ' cont' : '';
        const ch=chordSegHtml(toks,a,b);
        if(ch || lyric===null) html+=`<div class="ln cl${cont}">${ch}</div>`;
        if(lyric!==null) html+=`<div class="ln mono${cont}">${esc(lyric.slice(a,b))}</div>`;
      });
      continue;
    }
    if(!hasInlineChord(line)){ html+=`<div class="ln${sheet?' mono':''}">${esc(line)}</div>`; continue; }
    const parts = line.split(/\[([^\]]+)\]/); let h = esc(parts[0]);
    for(let i=1;i<parts.length;i+=2){
      const c = parts[i], txt = parts[i+1]||'';
      if(!parseChord(c)){ h += esc('['+c+']'+txt); continue; } // [algo] que no es acorde: queda como texto
      const shown = map(c);
      const m = /^(\S*)([\s\S]*)$/.exec(txt); const first = m[1], rest = m[2];
      h += `<span class="cw" style="--n:${shown.length}"><button class="ch" data-c="${esc(shown)}" data-orig="${esc(c)}">${esc(shown)}</button>${esc(first)||'&#8203;'}</span>${esc(rest)}`;
    }
    html+=`<div class="ln hc">${h}</div>`;
  }
  if(open) html+='</div>';
  return html;
}
/** Cuántas columnas de letra de ancho fijo entran en `el` con el tamaño de letra actual. */
function colsFor(el){
  if(!el || !el.clientWidth) return 0;
  const p=document.createElement('div'); p.className='ln mono'; p.style.cssText='position:absolute;visibility:hidden;white-space:pre;left:0;top:0';
  p.textContent='M'.repeat(40); el.appendChild(p);
  const cw=p.getBoundingClientRect().width/40; p.remove();
  const cs=getComputedStyle(el), w=el.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  return cw ? Math.max(12, Math.floor(w/cw)-2) : 0;

/* Opcional: pasa el formato "acordes arriba" a ChordPro (acordes dentro de la letra). */
function fromChordsOverLyrics(text){
  const L = cleanText(text).split('\n').map(expandTabs), out=[];
  for(let i=0;i<L.length;i++){
    const l=L[i]; const lab=sectionLabel(l.trim());
    if(lab){ out.push(`{c: ${lab}}`); continue; }
    const info=chordLineInfo(l);
    if(info){
      const label=info.tokens.find(t=>t.kind==='label'); if(label) out.push(`{c: ${sectionLabel(label.text)}}`);
      const pos=info.tokens.filter(t=>t.kind==='chord').map(t=>[t.pos,t.text]);
      const nx=L[i+1];
      if(nx!==undefined && nx.trim()!=='' && !chordLineInfo(nx) && !sectionLabel(nx.trim()) && !/^\s*\{/.test(nx)){
        let ly = nx.padEnd(Math.max(nx.length,pos[pos.length-1][0]),' ');
        for(let k=pos.length-1;k>=0;k--){ const [p,c]=pos[k]; ly = ly.slice(0,p)+`[${c}]`+ly.slice(p); }
        out.push(ly.replace(/\s+$/,'')); i++;
      } else out.push(pos.map(p=>`[${p[1]}]`).join('  '));
    } else out.push(l);
  }
  return out.join('\n');
}

const SMALL = new Set(['and','or','of','the','a','an','in','on','to','for','de','la','el','y','en','del','los','las','con','por','un','una','al','da','do','e']);
const TYPES = {chords:'acordes',tabs:'tab',tab:'tab',bass:'bajo',ukulele:'ukelele','guitar-pro':'Guitar Pro',power:'tab',drums:'batería',official:'oficial',video:'video'};
function titleCase(slug){ return slug.split(/[-_]+/).filter(Boolean).map((w,i)=> i>0 && SMALL.has(w.toLowerCase()) ? w.toLowerCase() : w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }
function cleanUrl(u){ try{ const x=new URL(u.trim()); x.hash=''; x.search=''; return (x.protocol+'//'+x.host.toLowerCase()+x.pathname).replace(/\/+$/,''); }catch(e){ return null; } }
function hashStr(s){ let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return h.toString(36); }
function parseLink(raw){
  const url = cleanUrl(raw); if(!url) return null;
  const u = new URL(url); const host=u.hostname.replace(/^www\./,''); const segs=u.pathname.split('/').filter(Boolean);
  if(/ultimate-guitar\.com$/.test(host) && segs[0]==='tab' && segs.length>=3){
    const m=/^(.*?)-(chords|tabs|tab|bass|ukulele|guitar-pro|power|drums|official|video)-(\d+)$/.exec(segs[2]);
    const artist = /^misc-/.test(segs[1]) ? titleCase(segs[1].replace(/^misc-/,'')) : titleCase(segs[1]);
    return {url, source:'Ultimate Guitar', short:'UG', title: titleCase(m?m[1]:segs[2]), artist, linkType: m?TYPES[m[2]]:'', id: m?'ug-'+m[3]:'l-'+hashStr(url)};
  }
  const parts = segs.map(s=>decodeURIComponent(s).replace(/\.(s?html?|php)$/i,'').replace(/-\d+$/,''));
  const src = host.split('.').slice(-2,-1)[0]||host;
  const title = parts.length ? titleCase(parts[parts.length-1]) : host;
  const artist = parts.length>1 ? titleCase(parts[parts.length-2]) : '';
  return {url, source: src.charAt(0).toUpperCase()+src.slice(1), short: src.slice(0,10), title, artist, linkType:'', id:'l-'+hashStr(url)};
}
function extractUrls(text){ return [...new Set((text.match(/https?:\/\/[^\s<>"'，,]+/g)||[]).map(u=>u.replace(/[).;]+$/,'')))]; }

const sleep = ms => new Promise(r=>setTimeout(r,ms));
/** Traduce un error de Supabase o de la red a los códigos que usa la app. */
function errCode(e){
  if(!e) return '';
  if(e.bandapp) return e.code;
  const st=e.status||0, c=String(e.code||''), m=String(e.message||'');
  if(c==='42501' || st===403 || /row-level security|permission denied/i.test(m)) return 'not_granted';
  if(st===401 || /^PGRST30/.test(c) || /JWT/i.test(m)) return 'auth';
  if(st===413 || ['54000','23514','22P02','22001'].includes(c)) return 'invalid_argument';
  if(st===429) return 'resource_exhausted';
  if(!st || st>=500 || /fetch|network|timeout/i.test(m)) return 'unavailable';
  return c||'error';
}
/** Ejecuta una consulta de Supabase: devuelve los datos o lanza un error con código traducido. */
async function run(query){
  let res;
  try{ res = await query; }catch(err){ const e=new Error(String(err&&err.message||err)); e.code='unavailable'; e.bandapp=true; throw e; }
  if(res.error){ const e=Object.assign(new Error(res.error.message||'error'),{code:res.error.code, status:res.status||res.error.status||0}); e.code=errCode(e); e.bandapp=true; throw e; }
  return res.data;
}
function writeErr(e){
  const c = errCode(e);
  if(c==='auth') return 'Tu sesión venció. Recargá la página y volvé a entrar.';
  if(c==='invalid_argument') return 'No se pudo guardar: la canción es demasiado grande o tiene datos inválidos.';
  if(c==='not_granted') return 'No tenés permiso para cambiar esto (modo lectura o sesión vencida).';
  return 'No se pudo guardar. Revisá la conexión y probá de nuevo.';
}
// Reintenta lo transitorio (red o límite de velocidad) con espera creciente; lo demás se informa.
async function dbWrite(fn){
  for(let i=0;;i++){
    try{ return await fn(); }
    catch(e){ const c=errCode(e); if((c==='unavailable'||c==='resource_exhausted') && i<5){ await sleep(500*2**i + Math.random()*400); continue; } throw e; }
  }
}
const plain = o => JSON.parse(JSON.stringify(o));
const localSaveSongs = () => lsSet('bandapp.songs', S.songs);
function songDoc(s){ return plain(s); }
const isoOf = ms => new Date(ms||Date.now()).toISOString();
const songRow = s => ({owner_id:ME, id:s.id, data:songDoc(s), updated_at:isoOf(s.updatedAt)});
function listData(l){ const d=plain(l); delete d.shareId; return d; }

async function saveSong(s){
  s.updatedAt = Date.now(); if(!s.createdAt) s.createdAt = s.updatedAt;
  if(db){ try{ await dbWrite(()=>run(db.from('songs').upsert(songRow(s)))); putLocal(s); return true; }catch(e){ toast(writeErr(e)); return false; } }
  putLocal(s); localSaveSongs(); return true;
}
// Refleja el cambio al instante en pantalla.
function putLocal(s){ const i=S.songs.findIndex(x=>x.id===s.id); if(i>=0) S.songs[i]=s; else S.songs.push(s); }
async function deleteSong(id){
  if(db){ try{ await dbWrite(()=>run(db.from('songs').delete().eq('owner_id',ME).eq('id',id))); S.songs=S.songs.filter(x=>x.id!==id); return true; }catch(e){ toast(writeErr(e)); return false; } }
  S.songs=S.songs.filter(x=>x.id!==id); localSaveSongs(); return true;
}
async function setStatus(s, st){
  const prev=s.status, prevAt=s.updatedAt; s.status=st;
  if(db){ s.updatedAt=Date.now(); try{ await dbWrite(()=>run(db.from('songs').upsert(songRow(s)))); }catch(e){ s.status=prev; s.updatedAt=prevAt; toast(writeErr(e)); return false; } }
  else localSaveSongs();
  return true;
}
let progWriting=false, progPending=false, progTouched=0;
async function saveProgress(){
  progTouched=Date.now();
  if(!db){ lsSet('bandapp.progress',S.progress); return; }
  if(progWriting){ progPending=true; return; }
  progWriting=true;
  try{ await dbWrite(()=>run(db.from('progress').upsert({owner_id:ME, data:{known:S.progress.known, notes:S.progress.notes, updatedAt:Date.now()}, updated_at:isoOf()}))); }catch(e){ toast(writeErr(e)); }
  progWriting=false; if(progPending){ progPending=false; saveProgress(); }
}
async function saveList(l){
  if(db){ try{
      const rows = await dbWrite(()=>run(db.from('lists').upsert({owner_id:ME, id:l.id, data:listData(l), updated_at:isoOf()}).select('share_id')));
      if(rows && rows[0]) l.shareId = rows[0].share_id;
      S.lists=S.lists.filter(x=>x.id!==l.id).concat(l); return true;
    }catch(e){ toast(writeErr(e)); return false; } }
  S.lists=S.lists.filter(x=>x.id!==l.id).concat(l); lsSet('bandapp.lists',S.lists); return true;
}
async function deleteList(id){
  if(db){ try{ await dbWrite(()=>run(db.from('lists').delete().eq('owner_id',ME).eq('id',id))); S.lists=S.lists.filter(x=>x.id!==id); return true; }catch(e){ toast(writeErr(e)); return false; } }
  S.lists=S.lists.filter(x=>x.id!==id); lsSet('bandapp.lists',S.lists); return true;
}
/**
 * Escribe muchas cosas en tandas (`size` por pedido, hasta 4 pedidos a la vez), con reintentos.
 * Se corta si no hay permiso de escritura o venció la sesión. Devuelve {ok, fail, stop, done}.
 */
async function runPool(items, worker, onProgress, size=1){
  const chunks=[]; for(let k=0;k<items.length;k+=size) chunks.push(items.slice(k,k+size));
  let i=0, ok=0, fail=0, stop=null; const done=[];
  const lane = async()=>{ while(i<chunks.length && !stop){ const ch=chunks[i++];
    try{ await dbWrite(()=>worker(ch)); ok+=ch.length; done.push(...ch); }
    catch(e){ fail+=ch.length; if(['not_granted','auth'].includes(errCode(e))) stop=e; }
    if(onProgress) onProgress(ok,fail); } };
  await Promise.all(Array.from({length:Math.min(4,chunks.length)}, lane));
  return {ok, fail, stop, done};
}
async function writeSongs(songs, onProgress){
  const now=Date.now();
  songs.forEach((s,i)=>{ if(!s.createdAt) s.createdAt=now+i; s.updatedAt=now; });
  if(!db){ for(const s of songs){ const i=S.songs.findIndex(x=>x.id===s.id); if(i>=0) S.songs[i]=s; else S.songs.push(s); } localSaveSongs(); if(onProgress) onProgress(songs.length,0); return {ok:songs.length, fail:0, stop:null}; }
  const r = await runPool(songs, ch=>run(db.from('songs').upsert(ch.map(songRow))), onProgress, 25);
  r.done.forEach(putLocal); softRender();
  if(r.stop) toast(writeErr(r.stop));
  return r;
}
async function removeSongs(ids, onProgress){
  if(!db){ const set=new Set(ids); S.songs=S.songs.filter(s=>!set.has(s.id)); localSaveSongs(); return {ok:ids.length, fail:0}; }
  const r = await runPool(ids, ch=>run(db.from('songs').delete().eq('owner_id',ME).in('id',ch)), onProgress, 100);
  const gone=new Set(r.done); S.songs=S.songs.filter(s=>!gone.has(s.id)); softRender();
  if(r.stop) toast(writeErr(r.stop));
  return r;
}

// Re-dibujar sin pisar formularios en uso. Con importaciones grandes llegan cientos de cambios
// seguidos: se agrupan en un solo dibujo cada ~150 ms.
let srT=0;
function softRender(){ clearTimeout(srT); srT=setTimeout(doSoftRender,150); }
function doSoftRender(){
  if(S.mode==='auth') return;
  if(S.showingLoad){ render(); return; } // todavía en "Cargando…": mostrar ya la pantalla pedida
  if(['edit','add','data'].includes(S.view)) return;
  if(S.view==='tags' && (S.tagEdit || S.importing)) return;
  if(document.getElementById('scrim') && S.view!=='song') return;
  if(S.view==='song' && S.loaded && !S.songs.find(s=>s.id===S.songId)){ S.view='library'; }
  if(S.view==='song') return; // no interrumpir a quien está tocando
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
function applyRole(){
  const nb=document.getElementById('new-song'); if(nb) nb.hidden = !S.canWrite;
}

/* Modo local: sin config.js la app guarda solo en este navegador y lo avisa. */
function goLocal(){
  if(S.mode!=='connecting') return;
  S.mode='local';
  S.songs = lsGet('bandapp.songs', EXAMPLES.map(s=>({...s})));
  S.lists = lsGet('bandapp.lists', []);
  S.progress = lsGet('bandapp.progress', S.progress);
  S.loaded = true; S.listsLoaded = true; render();
}
/* Trae todo lo de la persona (de a 1000 filas). */
async function fetchAll(table, cols){
  const out=[];
  for(let from=0;;from+=1000){
    const rows = await dbWrite(()=>run(db.from(table).select(cols).eq('owner_id',ME).order('id').range(from,from+999)));
    out.push(...(rows||[])); if(!rows || rows.length<1000) break;
  }
  return out;
}
async function loadAll(){
  const [songs, lists, prog] = await Promise.all([
    fetchAll('songs','id,data'), fetchAll('lists','id,data,share_id'),
    dbWrite(()=>run(db.from('progress').select('data').eq('owner_id',ME).maybeSingle())) ]);
  S.songs = songs.map(r=>({...r.data, id:r.id}));
  S.lists = lists.map(r=>({...r.data, id:r.id, shareId:r.share_id}));
  if(prog && prog.data){ const v=prog.data; S.progress={known:[...(v.known||[])], notes:v.notes||''}; }
}
const LOAD_FAIL = 'No se pudo conectar con la base de datos. Revisá tu conexión. Si hace más de una semana que nadie usa BandApp, puede que la base esté en pausa: entrá a supabase.com, abrí el proyecto y tocá “Restore project”.';
let loadTimer=0;
/* Con la sesión iniciada: carga todo y escucha cambios hechos desde otro dispositivo. */
async function startSession(session){
  if(db || !session) return;
  const ret=ssGet(RET_KEY); // venía de una lista compartida: volver ahí
  if(ret && /^#ver-/.test(ret)){ ssSet(RET_KEY,null); location.replace(SITE_URL+ret); location.reload(); return; }
  db=sb; ME=session.user.id; S.email=session.user.email||''; S.mode='db'; S.canWrite=true;
  if(S.view==='auth') S.view='library';
  route(); render();
  loadTimer = setTimeout(()=>{ if(!S.loaded){ S.dbSlow=true; render(); } }, 10000);
  try{ await loadAll(); }
  catch(e){ clearTimeout(loadTimer); S.loadError = errCode(e)==='auth' ? 'Tu sesión venció. Recargá la página y volvé a entrar.' : LOAD_FAIL; render(); return; }
  clearTimeout(loadTimer); S.loaded=true; S.listsLoaded=true; S.dbSlow=false; lastRefresh=Date.now();
  render(); listen();
}
function remoteSong(row){
  if(!row || !row.data) return; const s={...row.data, id:row.id};
  const cur=S.songs.find(x=>x.id===s.id); if(cur && (cur.updatedAt||0)>(s.updatedAt||0)) return;
  putLocal(s); softRender();
}
function remoteList(row){
  if(!row || !row.data) return;
  const l={...row.data, id:row.id, shareId:row.share_id}; S.lists=S.lists.filter(x=>x.id!==l.id).concat(l); softRender();
}
function remoteProgress(row){
  if(!row || !row.data || Date.now()-progTouched<5000) return; const v=row.data;
  S.progress={known:[...(v.known||[])], notes:v.notes||''};
  if(S.view==='learn' && document.activeElement?.id!=='notes') softRender();
}
let lastRefresh=0, refreshing=false;
/* Al volver a la pestaña (o abrir la app del teléfono) se trae lo último: así llegan también los borrados. */
async function refresh(){
  if(!db || refreshing || S.importing || Date.now()-lastRefresh<15000) return;
  refreshing=true; try{ await loadAll(); lastRefresh=Date.now(); softRender(); }catch(e){} refreshing=false;
}
function listen(){
  try{
    const f='owner_id=eq.'+ME, ch=db.channel('bandapp-'+ME);
    for(const ev of ['INSERT','UPDATE']){
      ch.on('postgres_changes',{event:ev, schema:'public', table:'songs', filter:f}, p=>remoteSong(p.new));
      ch.on('postgres_changes',{event:ev, schema:'public', table:'lists', filter:f}, p=>remoteList(p.new));
      ch.on('postgres_changes',{event:ev, schema:'public', table:'progress', filter:f}, p=>remoteProgress(p.new));
    }
    ch.subscribe();
  }catch(e){}
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refresh(); });
}
/* Lista compartida (#ver-<id>): se abre en solo lectura, sin cuenta. */
async function openShared(shareId){
  S.mode='shared'; S.canWrite=false; applyRole();
  if(!sb){ S.loadError='Este link necesita la base de datos de BandApp, y esta copia no la tiene configurada.'; render(); return; }
  try{
    const r = await dbWrite(()=>run(sb.rpc('get_shared_list',{p_share_id:shareId})));
    if(r && r.list){ const l={...r.list}; S.songs=(r.songs||[]).map(x=>({...x})); S.lists=[l]; S.listId=l.id; }
    // Si quien abre el link tiene cuenta y sesión en este navegador, puede guardar las canciones en su cancionero.
    try{ const {data:{session}} = await sb.auth.getSession();
      if(session){ VIEWER=session.user; const ids=S.songs.map(x=>x.id);
        for(let k=0;k<ids.length;k+=200){ const rows=await run(sb.from('songs').select('id').eq('owner_id',VIEWER.id).in('id',ids.slice(k,k+200))); (rows||[]).forEach(x=>SAVED.add(x.id)); } }
    }catch(e){}
  }catch(e){
    if(errCode(e)!=='invalid_argument'){ S.loadError='No se pudo abrir la lista. Revisá tu conexión y probá de nuevo.'; render(); return; }
  }
  S.loaded=true; S.listsLoaded=true; if(S.view!=='song') S.view='list'; render();
}

/* ---------- Iniciar sesión ----------
   v0.5 · Se entra con email y contraseña. Las cuentas las crea quien administra BandApp desde el
   panel de Supabase (no hay registro abierto). Queda, como alternativa, entrar con un código por
   mail para cuentas que ya existen. */
const RET_KEY='bandapp.return';
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); }catch(e){} }
/** Desde una lista compartida: ir a entrar y volver a la misma lista después. */
function goLogin(){ ssSet(RET_KEY, location.hash); location.href = SITE_URL; }
function vAuth(){
  const step = S.authStep || 'password';
  const back = ssGet(RET_KEY);
  const intro = {
    password: `<p class="muted" style="margin:0">Entrá con el email y la contraseña de tu cuenta.${back?' Después volvés a la lista que estabas viendo.':''}</p>`,
    email: `<p class="muted" style="margin:0">Te mandamos un código para entrar. Sirve solo si ya tenés una cuenta.</p>`,
    code: `<p style="margin:0">Te mandamos un código a <b>${esc(S.authEmail)}</b>. Escribilo acá. Si no llega en un minuto, revisá la carpeta de spam.</p>`
  }[step];
  const fields = {
    password: `<div class="f"><label for="a-email">Email</label><input id="a-email" type="email" inputmode="email" autocomplete="username" value="${esc(S.authEmail)}" placeholder="vos@ejemplo.com"></div>
      <div class="f"><label for="a-pass">Contraseña</label><input id="a-pass" type="password" autocomplete="current-password"></div>`,
    email: `<div class="f"><label for="a-email">Email</label><input id="a-email" type="email" inputmode="email" autocomplete="email" value="${esc(S.authEmail)}" placeholder="vos@ejemplo.com"></div>`,
    code: `<div class="f"><label for="a-code">Código</label><input id="a-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" style="font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center"></div>`
  }[step];
  const label = {password:'Entrar', email:'Enviarme el código', code:'Entrar'}[step];
  app.innerHTML = `<div class="authwrap"><div class="card stack" style="gap:14px">
    <div><div class="eyebrow">Tu cancionero</div><h1>Entrar a BandApp</h1></div>
    ${intro}
    <form id="a-form" class="stack" style="gap:12px" novalidate>
      ${fields}
      <div id="a-err" class="err" hidden></div>
      <button class="btn primary" type="submit" id="a-go" style="justify-content:center">${label}</button>
      ${step==='code'?`<div class="actions" style="justify-content:space-between"><button type="button" class="btn ghost" id="a-back">Usar otro email</button><button type="button" class="btn ghost" id="a-resend">Reenviar código</button></div>`:''}
    </form>
    ${step==='password'
      ? `<div class="hint">¿No tenés cuenta o te olvidaste la contraseña? Pedíselo a quien administra BandApp.</div>
         <div><button type="button" class="btn ghost" id="a-otp" style="padding-left:0">Entrar con un código por mail</button></div>`
      : `<div><button type="button" class="btn ghost" id="a-pw" style="padding-left:0">← Entrar con contraseña</button></div>`}
    ${back?`<div><a class="btn ghost" href="${esc(SITE_URL+back)}" id="a-cancel" style="padding-left:0">Volver a la lista sin entrar</a></div>`:''}
  </div></div>`;
  const $=id=>document.getElementById(id);
  const fail=msg=>{ const er=$('a-err'); er.textContent=msg; er.hidden=false; $('a-go').disabled=false; };
  const okEmail=em=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
  const send=async()=>{
    const {error} = await sb.auth.signInWithOtp({email:S.authEmail, options:{emailRedirectTo:SITE_URL, shouldCreateUser:false}});
    if(!error) return '';
    if(error.status===429 || /rate|seconds/i.test(error.message||'')) return 'Pediste varios códigos seguidos. Esperá un minuto y probá de nuevo.';
    if(/signup|not allowed|not found/i.test(error.message||'')) return 'No hay una cuenta con ese email. Pedile a quien administra BandApp que te la cree.';
    return 'No se pudo enviar el mail ('+(error.message||'error')+').';
  };
  $('a-form').addEventListener('submit', async e=>{ e.preventDefault(); $('a-go').disabled=true; $('a-err').hidden=true;
    if(step==='password'){
      const em=$('a-email').value.trim().toLowerCase(), pw=$('a-pass').value;
      if(!okEmail(em)){ fail('Revisá el email: parece incompleto.'); $('a-email').focus(); return; }
      if(!pw){ fail('Escribí tu contraseña.'); $('a-pass').focus(); return; }
      S.authEmail=em;
      const {data, error} = await sb.auth.signInWithPassword({email:em, password:pw});
      if(error || !data || !data.session){
        const m=String(error&&error.message||'');
        return fail(/invalid|credentials/i.test(m) ? 'Email o contraseña incorrectos.'
          : /confirm/i.test(m) ? 'Tu cuenta todavía no está confirmada. Pedile a quien administra BandApp que la confirme.'
          : (error&&error.status===429) ? 'Muchos intentos seguidos. Esperá un minuto y probá de nuevo.'
          : 'No se pudo entrar. Revisá tu conexión y probá de nuevo.');
      }
      return startSession(data.session);
    }
    if(step==='email'){
      const em=$('a-email').value.trim().toLowerCase();
      if(!okEmail(em)){ fail('Revisá el email: parece incompleto.'); $('a-email').focus(); return; }
      S.authEmail=em; const err=await send(); if(err) return fail(err);
      S.authStep='code'; vAuth(); $('a-code').focus(); return;
    }
    const token=$('a-code').value.replace(/\D/g,'');
    if(token.length<6){ fail('El código tiene 6 números (o más). Copialo del mail.'); $('a-code').focus(); return; }
    const {data, error} = await sb.auth.verifyOtp({email:S.authEmail, token, type:'email'});
    if(error || !data || !data.session) return fail('El código no es correcto o ya venció. Pedí uno nuevo con “Reenviar código”.');
    startSession(data.session);
  });
  const go=st=>()=>{ S.authStep=st; vAuth(); ($('a-email')||$('a-code')).focus(); };
  if($('a-otp')) $('a-otp').onclick=go('email');
  if($('a-pw')) $('a-pw').onclick=go('password');
  if($('a-back')) $('a-back').onclick=go('email');
  if($('a-resend')) $('a-resend').onclick=async()=>{ const err=await send(); if(err) fail(err); else toast('Te mandamos un código nuevo'); };
  if($('a-cancel')) $('a-cancel').onclick=()=>ssSet(RET_KEY,null);
  const first = step==='password' && S.authEmail ? $('a-pass') : ($('a-email')||$('a-code')); first.focus();
}

/* ---------- Copiar canciones de una lista compartida a mi cancionero ---------- */
let VIEWER=null; const SAVED=new Set(); // quien mira la lista (si tiene sesión) y lo que ya tiene guardado
function copyOf(s){
  const now=Date.now(); const c={id:s.id, title:s.title||'Sin título', artist:s.artist||'', key:s.key||'', capo:s.capo||0, level:s.level||'',
    tags:[...(s.tags||[])], status:'aprender', url:s.url||'', source:s.source||'', short:s.short||'', linkType:s.linkType||'', body:s.body||'', sample:false, createdAt:now, updatedAt:now};
  return {owner_id:VIEWER.id, id:s.id, data:c, updated_at:isoOf(now)};
}
async function saveToMine(songs, onProgress){
  const todo=songs.filter(s=>!SAVED.has(s.id));
  let ok=0, fail=0;
  for(let k=0;k<todo.length;k+=25){
    const ch=todo.slice(k,k+25);
    try{ await dbWrite(()=>run(sb.from('songs').upsert(ch.map(copyOf), {onConflict:'owner_id,id', ignoreDuplicates:true}))); ok+=ch.length; ch.forEach(s=>SAVED.add(s.id)); }
    catch(e){ fail+=ch.length; if(['auth','not_granted'].includes(errCode(e))){ toast('Tu sesión venció: volvé a entrar.'); break; } }
    if(onProgress) onProgress(ok,fail);
  }
  return {ok, fail, already:songs.length-todo.length};
}
/** Botón para guardar una o varias canciones. Sin sesión, ofrece entrar. */
function saveBtnHtml(songs, id){
  if(S.mode!=='shared' || !songs.length) return '';
  const left=songs.filter(s=>!SAVED.has(s.id)).length;
  if(VIEWER && !left) return `<button class="btn" id="${id}" disabled>✓ ${songs.length===1?'Ya está en tu cancionero':'Ya están en tu cancionero'}</button>`;
  const label = songs.length===1 ? 'Guardar en mi cancionero' : `Guardar ${left===songs.length?'las':'las otras'} ${left} en mi cancionero`;
  return `<button class="btn" id="${id}">＋ ${label}</button>`;
}
function wireSaveBtn(songs, id, redraw){
  const b=document.getElementById(id); if(!b || b.disabled) return;
  b.onclick=async()=>{
    if(!VIEWER) return askLogin();
    b.disabled=true; b.textContent='Guardando…';

    redraw();
  };
}

/* ---------- QR de la lista (para compartir en el momento) ---------- */
let qrLib=null;
function loadQr(){
  if(window.qrcode) return Promise.resolve(window.qrcode);
  if(!qrLib) qrLib=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    sc.onload=()=>window.qrcode?res(window.qrcode):rej(new Error('qr')); sc.onerror=()=>{ qrLib=null; rej(new Error('qr')); }; document.head.appendChild(sc); });
  return qrLib;
}
async function openQr(l){

/* Arranque: lista compartida → solo lectura; sin config → modo local; sin sesión → pantalla de entrada. */
async function boot(){
  if(S.sharedId) return openShared(S.sharedId);
  if(!sb) return goLocal();
  sb.auth.onAuthStateChange((ev, session)=>{
    if(S.mode==='shared') return;
    if(session && (ev==='SIGNED_IN' || ev==='INITIAL_SESSION')) setTimeout(()=>startSession(session),0);
    else if(ev==='SIGNED_OUT' && S.mode==='db') location.href = SITE_URL;
  });
  let session=null;
  try{ ({data:{session}} = await sb.auth.getSession()); }catch(e){}
  if(session) return startSession(session);
  if(!db){ S.mode='auth'; render(); }
}

/* ---------- Helpers ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function cmpTitle(a,b){ return (a.title||'').localeCompare(b.title||'','es',{sensitivity:'base'}); }
let toastT; function toast(msg){ const o=document.getElementById('toastbox')||Object.assign(document.body.appendChild(document.createElement('div')),{id:'toastbox'}); o.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>o.innerHTML='',2600); }
const LVL = {principiante:'Principiante',intermedio:'Intermedio',avanzado:'Avanzado'};
function bestCapo(chords){
  let best={capo:0,hard:Infinity};
  for(let c=0;c<=7;c++){ const hard = chords.filter(x=>!EASY.has(base(transpose(x,-c)))).length; if(hard<best.hard) best={capo:c,hard}; }
  return best;
}
function playable(song, known){
  const w = song.capo||0; // capo de la versión escrita: el sonido real son las formas + w
  const ch = [...new Set(chordsIn(song.body).map(c=>base(transpose(c,w,false))))]; const K = new Set(known.map(norm));
  let best=null;
  for(let c=0;c<=7;c++){ const miss = [...new Set(ch.map(x=>base(transpose(x,-c))))].filter(x=>!K.has(x)); if(!best||miss.length<best.miss.length) best={capo:c,miss}; }
  return best;
}

function applyFilter(f){
  const q=(f.q||'').trim().toLowerCase();
  return S.songs.filter(s=>{
    if(q && !((s.title||'')+' '+(s.artist||'')+' '+(s.tags||[]).join(' ')).toLowerCase().includes(q)) return false;
    if(f.fStatus && stOf(s)!==f.fStatus) return false;
    if(f.fLevel && s.level!==f.fLevel) return false;
    // Contenido: "link" = guardada solo como enlace (sin letra), "lyrics" = con letra. fTag "__link" es el formato viejo.
    const content = f.fContent || (f.fTag==='__link' ? 'link' : null);
    if(content==='link' && (s.body||'').trim()) return false;
    if(content==='lyrics' && !(s.body||'').trim()) return false;
    if(f.fTag && f.fTag!=='__link' && !(s.tags||[]).includes(f.fTag)) return false;
    return true; }).sort(cmpTitle);
}
function listSongs(l){ if(l.live && l.filter) return applyFilter(l.filter); const m=new Map(S.songs.map(s=>[s.id,s])); return (l.songIds||[]).map(id=>m.get(id)).filter(Boolean).sort(cmpTitle); }

/* ---------- Importar y exportar ---------- */
// Formato de la copia (JSON) = el que acepta la versión para tu servidor (POST /api/songs/import):
// { app:"BandApp", format:"bandapp-export", version:1, songs:[...], lists:[...], progress:{...} }
const SONG_FIELDS = ['id','title','artist','key','capo','level','tags','status','url','source','short','linkType','body','sample','createdAt','updatedAt'];
const LEVELS = new Set(['principiante','intermedio','avanzado']);
const MAX_BODY = 50000; // mismo límite que la API de la versión para servidor

function normKey(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function songKey(s){ return normKey(s.title)+'|'+normKey(s.artist); }
function existingIndex(){ const byId=new Map(), byKey=new Map(), byUrl=new Map();
  for(const s of S.songs){ byId.set(s.id,s); byKey.set(songKey(s),s); if(s.url) byUrl.set(s.url,s); } return {byId,byKey,byUrl}; }
function findDup(idx, s){ return idx.byId.get(s.id) || (s.url && idx.byUrl.get(s.url)) || idx.byKey.get(songKey(s)) || null; }

/** Deja una canción con los campos y tipos que espera BandApp (y la API del servidor). */
function cleanSong(raw){
  const s={}; for(const k of SONG_FIELDS) if(raw[k]!==undefined && raw[k]!==null) s[k]=raw[k];
  s.title=String(s.title||'').trim().slice(0,200) || 'Sin título';
  s.artist=String(s.artist||'').trim().slice(0,200);
  s.key=String(s.key||'').trim().slice(0,8);
  s.level=LEVELS.has(s.level)?s.level:'';
  s.status=STATUS[s.status]?s.status:'aprender';
  s.tags=[...new Set((Array.isArray(s.tags)?s.tags:String(s.tags||'').split(',')).map(t=>String(t).trim().slice(0,40)).filter(Boolean))].slice(0,20);
  s.url=/^https?:\/\//i.test(s.url||'')?String(s.url).slice(0,2000):'';
  s.source=String(s.source||'').slice(0,60); s.short=String(s.short||'').slice(0,20); s.linkType=String(s.linkType||'').slice(0,30);
  s.body=cleanText(s.body); s.sample=!!s.sample;
  s.capo=Math.min(11,Math.max(0,parseInt(s.capo,10)||0));
  if(!ID_RE.test(s.id||'')) s.id = s.url ? (parseLink(s.url)||{}).id || 'i-'+hashStr(songKey(s)) : 'i-'+hashStr(songKey(s));
  if(typeof s.createdAt!=='number') delete s.createdAt;
  delete s.updatedAt;
  return s;
}

/* Archivos de texto: ChordPro (.cho/.chordpro/.pro) o texto con acordes arriba de la letra (.txt). */
async function readText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder('utf-8').decode(buf);
  if(t.includes('\uFFFD')) t = new TextDecoder('windows-1252').decode(buf); // archivos viejos de Windows
  return cleanText(t);
}
function splitName(name, order){
  const base = name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  const m = /^(.+?)\s+[-–—]\s+(.+)$/.exec(base);
  if(!m) return {title:base, artist:''};
  return order==='title-artist' ? {title:m[1].trim(), artist:m[2].trim()} : {title:m[2].trim(), artist:m[1].trim()};
}
function parseSongFile(name, text, order){
  let title='', artist='', key=''; const lines=[];
  for(const raw of text.split('\n')){
    const d=/^\s*\{\s*(title|t|artist|subtitle|st|key)\s*:\s*(.*?)\s*\}\s*$/i.exec(raw);
    if(d){ const k=d[1].toLowerCase(); if(k==='title'||k==='t') title=title||d[2]; else if(k==='key') key=key||d[2]; else artist=artist||d[2]; continue; }
    lines.push(raw);
  }
  let body = lines.join('\n').replace(/^\n+|\s+$/g,'');
  // Se guarda tal cual: BandApp muestra igual el formato "acordes arriba de la letra" y el ChordPro.
  const fromName = splitName(name, order);
  const s = cleanSong({title:title||fromName.title, artist:artist||fromName.artist, body, status:'aprender', level:''});
  const ch = chordsIn(s.body);
  s.key = key || (ch[0] ? ch[0].split('/')[0] : '');
  s.id = 'f-'+hashStr(songKey(s));
  return s;
}
/* Lista de títulos pegada: una canción por línea, "Título - Artista" o "Artista - Título". También acepta links. */
function parseTitleList(text, order){
  const out=[];
  for(let line of text.split('\n')){
    line=line.replace(/^\s*(?:\d+[.)]\s*|[-*•]\s+)/,'').trim(); if(!line) continue;
    const url=(line.match(/https?:\/\/\S+/)||[])[0];
    if(url && line.replace(url,'').trim()===''){ const p=parseLink(url); if(p){ out.push(cleanSong(linkSong(p))); continue; } }
    const clean=line.replace(/https?:\/\/\S+/,'').trim();
    const parts=clean.split(/\s+[-–—|]\s+|\t/).map(x=>x.trim()).filter(Boolean);
    let title=clean, artist='';
    if(parts.length>=2){ if(order==='title-artist'){ title=parts[0]; artist=parts.slice(1).join(' - '); } else { artist=parts[0]; title=parts.slice(1).join(' - '); } }
    const s=cleanSong({title, artist, url:url||'', status:'aprender', body:''});
    if(url){ const p=parseLink(url); if(p) Object.assign(s,{source:p.source, short:p.short, linkType:p.linkType}); }
    s.id = url && parseLink(url) ? parseLink(url).id : 't-'+hashStr(songKey(s));
    out.push(s);
  }
  return out;
}

function exportPayload(){
  return { app:'BandApp', format:'bandapp-export', version:1, exportedAt:new Date().toISOString(),
    songs:S.songs.map(s=>{ const c=cleanSong(s); c.createdAt=s.createdAt||undefined; c.updatedAt=s.updatedAt||undefined; return plain(c); }).sort(cmpTitle),
    lists:S.lists.map(l=>({id:l.id, name:l.name, note:l.note||'', live:!!l.live, filter:l.filter||{}, ...(l.origFilter?{origFilter:l.origFilter}:{}), songIds:l.songIds||[], createdAt:l.createdAt||null})),
    progress:{known:S.progress.known||[], notes:S.progress.notes||''} };
}
function toCsv(){
  const cols=['id','title','artist','key','capo','level','status','tags','url','source','has_lyrics','chords'];
  const q=v=>{ const t=String(v??''); return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const rows=[...S.songs].sort(cmpTitle).map(s=>[s.id,s.title,s.artist,s.key,s.capo||0,s.level,stOf(s),(s.tags||[]).join(', '),s.url,s.source,(s.body||'').trim()?'sí':'no',chordsIn(s.body).join(' ')].map(q).join(','));
  return '\uFEFF'+[cols.join(','),...rows].join('\n');
}
async function offerFile(filename, data, fallbackId){
  try{
    const blob = new Blob([data], {type: /\.json$/.test(filename) ? 'application/json' : 'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000); toast('Archivo descargado'); return;
  }catch(e){}
  const box=document.getElementById(fallbackId); if(!box) return;
  box.hidden=false; box.value=data; box.focus(); box.select();
  toast('No se pudo descargar acá: copiá el texto seleccionado y guardalo en un archivo');
}

    <section class="card stack" style="gap:12px" aria-labelledby="h-export">

      <div class="actions"><button class="btn primary" id="x-json" ${n?'':'disabled'}>Copia completa (JSON)</button><button class="btn" id="x-csv" ${n?'':'disabled'}>Planilla (CSV)</button></div>

      <div class="stats"><span><b>${data.songs.length}</b> leídas</span><span><b>${fresh.length}</b> nuevas</span>${dups.length?`<span class="muted"><b>${dups.length}</b> repetidas o ya cargadas</span>`:''}${big.length?`<span class="muted"><b>${big.length}</b> demasiado largas</span>`:''}${data.bad.length?`<span class="muted"><b>${data.bad.length}</b> archivos no se pudieron leer</span>`:''}${data.lists.length?`<span><b>${data.lists.length}</b> ${data.lists.length===1?'lista':'listas'}</span>`:''}</div>
      ${sample.length?`<div class="tablewrap"><table class="prev"><thead><tr><th>Título</th><th>Artista</th><th>Acordes</th></tr></thead><tbody>${sample.map(s=>`<tr><td>${esc(s.title)}</td><td>${esc(s.artist)||'<span class="muted">—</span>'}</td><td class="mono">${esc(chordsIn(s.body).slice(0,6).join(' '))||'<span class="muted">sin letra</span>'}</td></tr>`).join('')}</tbody></table></div>${fresh.length>sample.length?`<div class="hint">…y ${fresh.length-sample.length} más.</div>`:''}`:''}
      ${data.dups.length?`<label class="check"><input type="checkbox" id="${p}-replace"><span>Reemplazar ${data.dups.length===1?'la que ya está cargada':`las ${data.dups.length} que ya están cargadas`} con la versión del archivo (si no, se saltean)</span></label>`:''}
      <div class="actions"><button class="btn primary" id="${p}-go" ${fresh.length||data.dups.length||data.lists.length?'':'disabled'}>Importar</button><span id="${p}-prog" class="muted" style="font-size:14px" aria-live="polite"></span></div>
      <div class="progress" id="${p}-bar" hidden><i style="width:0%"></i></div></div>`;
    $(p+'-go').onclick=()=>runImport(p, data);
  }
  async function runImport(p, data){
    if(S.importing) return;
    const replace = $(p+'-replace')?.checked;
    const tags=canonicalTags($(p==='f'?'f-tags':'t-tags').value.split(',').map(t=>t.trim()).filter(Boolean));
    const addTags=s=>tags.length?{...s, tags:[...new Set([...(s.tags||[]),...tags])]}:s;
    const toWrite=[...data.fresh.map(addTags), ...(replace?data.dups.map(d=>({...addTags(d.s), id:d.ex.id, createdAt:d.ex.createdAt, status:d.s.status!=='aprender'?d.s.status:d.ex.status})):[])];
    const n=toWrite.length; S.importing=true;
    $(p+'-go').disabled=true; $(p+'-bar').hidden=false;
    const prog=(ok,fail)=>{ $(p+'-prog').textContent=`Guardando ${ok+fail} de ${n}… no cierres la página.`; $(p+'-bar').firstElementChild.style.width=Math.round((ok+fail)/Math.max(n,1)*100)+'%'; };
    prog(0,0);
    const r = n ? await writeSongs(toWrite, prog) : {ok:0, fail:0};
    let nl=0; for(const l of data.lists||[]){ if(!S.lists.find(x=>x.id===l.id)){ if(await saveList({id:l.id,name:String(l.name||'Lista'),note:String(l.note||''),live:!!l.live,filter:l.filter||{},...(l.origFilter&&typeof l.origFilter==='object'?{origFilter:l.origFilter}:{}),songIds:Array.isArray(l.songIds)?l.songIds:[],createdAt:l.createdAt||Date.now()})) nl++; } }
    if(data.progress && Array.isArray(data.progress.known)){ S.progress={known:[...new Set([...(S.progress.known||[]),...data.progress.known.map(String)])], notes:S.progress.notes||String(data.progress.notes||'')}; await saveProgress(); }
    S.importing=false;
    $(p+'-prog').innerHTML=`${r.ok} ${r.ok===1?'canción guardada':'canciones guardadas'}${nl?` y ${nl} ${nl===1?'lista':'listas'}`:''}${r.fail?` · ${r.fail} no se pudieron guardar (volvé a importar para reintentar; las ya guardadas se saltean)`:''}. <button class="btn ghost" id="${p}-see" style="padding:2px 4px">Ver cancionero</button>`;
    $(p+'-see').onclick=()=>{ S.view='library'; S.q=''; S.fStatus=S.fLevel=S.fContent=null; S.fTag=tags[0]||null; S.sort='recent'; render(); scrollTo(0,0); };
    if(p==='t') $('t-text').value='';
  }
}

/* ---------- Etiquetas: gestor y sugerencias ---------- */
// Dos etiquetas son "la misma" si solo cambian mayúsculas, acentos o espacios ("cancionero" = "Cancionero").
const tagKey = t => normKey(t);
function allTags(){ const m=new Map(); for(const s of S.songs) for(const t of (s.tags||[])) m.set(t,(m.get(t)||0)+1); return m; }
/** Si ya existe una etiqueta equivalente, devuelve esa grafía (la más usada); si no, la escrita. */
function canonicalTag(t, except){
  t=String(t||'').trim(); if(!t) return t;
  let best=null, n=-1;
  for(const [name,count] of allTags()) if(name!==except && tagKey(name)===tagKey(t) && count>n){ best=name; n=count; }
  return best || t;
}
const canonicalTags = list => [...new Set(list.map(t=>canonicalTag(t)).filter(Boolean))];

/**
 * Cambia una etiqueta en todas las canciones: renombrar/unir (newTag) o quitar (newTag = null).
 * Las listas "vivas" que filtraban por esa etiqueta se actualizan: con el nombre nuevo, o, si se
 * borra, pasan a ser listas fijas con las canciones que tenían en ese momento.
 */
async function retag(oldTag, newTag, onProgress){
  const liveLists = S.lists.filter(l=>l.live && l.filter && l.filter.fTag===oldTag).map(l=>({l, ids:listSongs(l).map(s=>s.id)}));
  const changed = S.songs.filter(s=>(s.tags||[]).includes(oldTag)).map(s=>{
    const tags=(s.tags||[]).filter(t=>t!==oldTag); if(newTag && !tags.includes(newTag)) tags.push(newTag);
    return {...s, tags};
  });
  S.importing=true;
  const r = await writeSongs(changed, onProgress);
  for(const {l,ids} of liveLists){
    if(newTag) await saveList({...l, filter:{...l.filter, fTag:newTag}});
    else await saveList({...l, live:false, filter:{...l.filter, fTag:null}, songIds:ids});
  }
  if(S.fTag===oldTag) S.fTag=newTag||null;
  S.importing=false;
  return {...r, n:changed.length, lists:liveLists.length};
}

function vTags(){
  const tags=[...allTags()].sort((a,b)=>a[0].localeCompare(b[0],'es',{sensitivity:'base'}));
  // Grupos de posibles repetidas (misma palabra con distinta mayúscula o acento)
  const groups=new Map(); for(const [t,c] of tags){ const k=tagKey(t); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push([t,c]); }
  const dups=[...groups.values()].filter(g=>g.length>1).map(g=>g.sort((a,b)=>b[1]-a[1]));
  const tagged=S.songs.filter(s=>(s.tags||[]).length).length;
  app.innerHTML = `<div class="stack">
    <div><button class="btn ghost" id="back" style="padding-left:0">← Cancionero</button></div>
    <div><div class="eyebrow">Ordenar</div><h1>Etiquetas</h1>
      <p class="muted" style="margin:.3em 0 0;max-width:62ch">${tags.length} ${tags.length===1?'etiqueta':'etiquetas'} en ${tagged} ${tagged===1?'canción':'canciones'}. Renombrar o borrar una etiqueta cambia todas las canciones que la tienen; las canciones no se borran. Si le ponés el nombre de otra que ya existe, se unen.</p></div>
    ${dups.length?`<section class="card stack" style="gap:10px"><h2>Parecen repetidas</h2>
      ${dups.map((g,i)=>`<div class="duprow"><span>${g.map(([t,c])=>`<span class="tag">${esc(t)}</span> <span class="muted">${c}</span>`).join(' · ')}</span><button class="btn" data-merge="${i}">Unir en “${esc(g[0][0])}”</button></div>`).join('')}
    </section>`:''}
    <div id="tg-prog" class="muted" style="font-size:14px" aria-live="polite"></div>
    ${tags.length?`<div class="list tlist">${tags.map(([t,c],i)=>`<div class="trow" data-i="${i}">
      ${S.tagEdit===t
        ? `<form class="tedit" data-form="${i}"><label class="sr" for="tg-in">Nuevo nombre para ${esc(t)}</label><input id="tg-in" value="${esc(t)}" autocomplete="off"><button class="btn primary" type="submit">Guardar</button><button class="btn ghost" type="button" data-cancel>Cancelar</button></form>`
        : `<span class="tname"><span class="tag">${esc(t)}</span><span class="muted">${c} ${c===1?'canción':'canciones'}</span></span>
           <span class="actions"><button class="btn" data-see="${i}">Ver</button>${S.canWrite?`<button class="btn" data-ren="${i}">Renombrar</button><button class="btn danger" data-del="${i}">Borrar</button>`:''}</span>`}
    </div>`).join('')}</div>`
    :'<div class="list"><div class="empty">Todavía no hay etiquetas. Las agregás al editar una canción, al importar, o seleccionando varias canciones en el cancionero.</div></div>'}
  </div>`;
  const $=id=>document.getElementById(id);
  const prog=$('tg-prog');
  const busy=on=>{ app.querySelectorAll('.trow button, .duprow button, .tedit input').forEach(b=>b.disabled=on); };
  const done=(msg)=>{ S.tagEdit=null; vTags(); toast(msg); };
  const run=async(oldTag,newTag,msg)=>{
    busy(true);
    const r=await retag(oldTag,newTag,(ok,fail)=>{ prog.textContent=`Actualizando canciones… ${ok+fail}`; });
    prog.textContent='';
    done(r.fail?`${msg} · ${r.fail} canciones no se pudieron actualizar`:`${msg}${r.lists?` · ${r.lists} ${r.lists===1?'lista actualizada':'listas actualizadas'}`:''}`);
  };
  $('back').onclick=()=>{ S.tagEdit=null; S.view='library'; render(); };
  app.querySelectorAll('[data-see]').forEach(b=>b.onclick=()=>{ const t=tags[+b.dataset.see][0]; S.q=''; S.fStatus=S.fLevel=S.fContent=null; S.fTag=t; S.view='library'; render(); scrollTo(0,0); });
  app.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{ S.tagEdit=tags[+b.dataset.ren][0]; vTags(); const i=$('tg-in'); i.focus(); i.select(); });
  app.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{ S.tagEdit=null; vTags(); });
  app.querySelectorAll('[data-form]').forEach(f=>f.addEventListener('submit',e=>{ e.preventDefault();
    const old=tags[+f.dataset.form][0]; const typed=$('tg-in').value.trim().slice(0,40);
    if(!typed || typed===old){ S.tagEdit=null; vTags(); return; }
    const target = canonicalTag(typed, old);
    run(old, target, target!==typed || allTags().has(target) ? `“${old}” se unió con “${target}”` : `“${old}” ahora se llama “${target}”`);
  }));
  app.querySelectorAll('[data-del]').forEach(b=>{ let armed=false; b.onclick=()=>{
    const [t,c]=tags[+b.dataset.del];
    if(!armed){ armed=true; b.classList.add('armed'); b.textContent=`Quitar de ${c} ${c===1?'canción':'canciones'}`; setTimeout(()=>{ if(b.isConnected){ armed=false; b.classList.remove('armed'); b.textContent='Borrar'; } },3500); return; }
    run(t, null, `Etiqueta “${t}” borrada`);
  }; });
  app.querySelectorAll('[data-merge]').forEach(b=>b.onclick=async()=>{
    const g=dups[+b.dataset.merge]; const target=g[0][0];
    busy(true); let fail=0;
    for(const [t] of g.slice(1)){ const r=await retag(t,target,(ok,f)=>{ prog.textContent=`Uniendo “${t}”… ${ok+f}`; }); fail+=r.fail; }
    prog.textContent=''; done(fail?`Unidas en “${target}” · ${fail} canciones no se pudieron actualizar`:`Unidas en “${target}”`);
  });
}

/** Sugerencias debajo de un campo de etiquetas separado por comas: tocás una y se agrega. */
function wireTagSuggest(input, box){
  const draw=()=>{
    const parts=input.value.split(','); const frag=tagKey(parts[parts.length-1]);
    const have=new Set(parts.slice(0,-1).map(tagKey).filter(Boolean));
    const opts=[...allTags()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(t=>!have.has(tagKey(t)) && (!frag || tagKey(t).includes(frag)) && tagKey(t)!==frag).slice(0,12);
    box.innerHTML = opts.length ? `<span class="muted">Tus etiquetas:</span>${opts.map(t=>`<button type="button" class="tag sug" data-t="${esc(t)}">${esc(t)}</button>`).join('')}` : '';
    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
      const ps=input.value.split(','); ps[ps.length-1]=' '+b.dataset.t;
      input.value=ps.map(x=>x.trim()).filter(Boolean).join(', ')+', '; input.focus(); draw();
    });
  };
  input.addEventListener('input',draw); input.addEventListener('focus',draw); draw();
}
function vLearn(){
  const known = S.progress.known;

  const res = S.songs.map(s=>({s, p:playable(s,known)})).filter(x=>chordsIn(x.s.body).length);
  const ready = res.filter(x=>x.p.miss.length===0).sort((a,b)=>cmpTitle(a.s,b.s));
  const close = res.filter(x=>x.p.miss.length>0 && x.p.miss.length<=2).sort((a,b)=>a.p.miss.length-b.p.miss.length);
  app.innerHTML = `<div class="stack">
    <div><div class="eyebrow">Modo aprendiz</div><h1>Ruta desde cero</h1>
      <p class="muted" style="max-width:62ch;margin:.4em 0 0">Marcá los acordes que tu aprendiz ya toca limpio. BandApp busca qué canciones del cancionero ya puede tocar, probando con capo para evitar la cejilla.</p></div>
    <div class="card stack" style="gap:6px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>Progreso de la ruta</b><span class="muted">${all.filter(c=>known.includes(c)).length} de ${all.length} acordes</span></div><div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <div class="two">
      <div class="card"><h2 style="margin-bottom:6px">Ya puede tocar</h2><div class="mini">${ready.length? ready.map(x=>`<button data-id="${esc(x.s.id)}"><span class="t">${esc(x.s.title)}</span><span class="need">${x.p.capo?`capo ${x.p.capo}`:'sin capo'}</span></button>`).join('') : '<div class="need" style="padding:10px 0">Todavía ninguna. Sumá acordes de la etapa 1 y 2.</div>'}</div></div>
      <div class="card"><h2 style="margin-bottom:6px">Le falta poco</h2><div class="mini">${close.length? close.map(x=>`<button data-id="${esc(x.s.id)}"><span class="t">${esc(x.s.title)}</span><span class="need">falta ${x.p.miss.map(esc).join(', ')}${x.p.capo?` · capo ${x.p.capo}`:''}</span></button>`).join('') : '<div class="need" style="padding:10px 0">Nada cerca por ahora.</div>'}</div></div>
    </div>
    <div class="card">${STAGES.map(st=>{ const n=st.chords.filter(c=>known.includes(c)).length; return `<section class="stage"><h3>${esc(st.name)} <span class="cnt">${n}/${st.chords.length} · ${esc(st.note)}</span></h3>
      <div class="cgrid">${st.chords.map(c=>`<button class="kc" data-k="${esc(c)}" aria-pressed="${known.includes(c)}" aria-label="${esc(c)}${known.includes(c)?', aprendido':''}">${diagram(c)}<span class="n">${esc(c)}</span></button>`).join('')}</div></section>`; }).join('')}</div>
    <div class="card stack" style="gap:10px"><h2>Notas de mi propio aprendizaje</h2>
      <p class="muted" style="margin:0;font-size:14px">Lo que a vos te trabó y cómo lo destrabaste. Sirve para anticipar dónde se va a frustrar tu aprendiz.</p>
      <textarea id="notes" class="notes" placeholder="Ej.: el cambio G → C me costó dos semanas. Lo que funcionó: dejar el anular fijo y practicar solo ese cambio 1 minuto por día.">${esc(S.progress.notes)}</textarea>
      <div class="hint" id="nstate">Se guarda al salir del campo.</div></div>
    <div class="foot">${S.mode==='db'?'<span class="dot live"></span>Progreso guardado en tu cuenta':'<span class="dot"></span>Modo local: el progreso queda en este navegador'}</div>
  </div>`;
  app.querySelectorAll('.kc').forEach(b=>b.onclick=()=>{ if(!S.canWrite) return; const c=b.dataset.k; const k=S.progress.known; S.progress.known = k.includes(c)? k.filter(x=>x!==c) : [...k,c]; saveProgress(); const y=window.scrollY; vLearn(); window.scrollTo(0,y); });
  app.querySelectorAll('.mini button[data-id]').forEach(b=>b.onclick=()=>openSong(b.dataset.id));
  const n=document.getElementById('notes'); if(!S.canWrite) n.readOnly=true; n.addEventListener('change',()=>{ S.progress.notes=n.value; saveProgress(); document.getElementById('nstate').textContent='Notas guardadas.'; });
}

/* ---------- Global wiring ---------- */
document.getElementById('home').onclick=()=>{ S.fromList=null; S.view='library'; render(); };
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ S.fromList=null; S.view=b.dataset.go; render(); window.scrollTo(0,0); });
document.getElementById('new-song').onclick=()=>{ if(!S.canWrite) return; S.view='add'; render(); window.scrollTo(0,0); };
document.getElementById('menu-btn').onclick=()=>openMenu();
// Cerrar el panel de controles de la canción al tocar fuera de él
// (composedPath: el botón tocado puede haberse re-renderizado antes de que el evento llegue acá)
document.addEventListener('click',e=>{ if(S.view!=='song' || !S.ctlOpen) return; const path=e.composedPath?e.composedPath():[]; if(path.some(n=>n && (n.id==='fabs' || n.id==='overlay'))) return; S.ctlOpen=false; keep(vSong); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && overlay.innerHTML && !S.importing){ overlay.innerHTML=''; return; }
  if(e.key==='Escape' && S.view==='song' && S.ctlOpen){ S.ctlOpen=false; keep(vSong); document.getElementById('ctl-btn')?.focus(); return; }
  if(S.view==='song' && e.code==='Space' && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){ e.preventDefault(); S.playing?stopScroll(true):startScroll(); }
});
['wheel'].forEach(ev=>window.addEventListener(ev,()=>{ if(S.playing) stopScroll(true); },{passive:true}));
// Avisar antes de cerrar si hay una importación en curso.
window.addEventListener('beforeunload',e=>{ if(S.importing){ e.preventDefault(); e.returnValue=''; } });
// Rutas por #: #l-<id> abre una lista, #aprender, #importar, #telefono.
function route(){ const h=location.hash.slice(1); const v=/^ver-([0-9a-fA-F-]{36})$/.exec(h);
  if(v){ S.sharedId=v[1]; if(S.view!=='song') S.view='list'; if(S.lists[0]) S.listId=S.lists[0].id; return; }
  const m=/^l-([A-Za-z0-9_-]+)$/.exec(h);
  if(m){ S.view='list'; if(S.listId!==m[1]) S.listMore=false; S.listId=m[1]; } else if(h==='aprender') S.view='learn'; else if(h==='importar') S.view='data'; else if(h==='telefono') S.view='phone'; else if(h==='etiquetas') S.view='tags'; }
window.addEventListener('hashchange',()=>{ const v=/^ver-(.+)$/.exec(location.hash.slice(1)); if(v && v[1]!==S.sharedId){ location.reload(); return; } if(S.mode==='auth') return; route(); render(); scrollTo(0,0); });

/* ---------- Boot ---------- */
route(); render(); boot();
})();
